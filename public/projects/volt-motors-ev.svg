<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="carbonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#050506" />
    </linearGradient>

    <!-- Orange Glow -->
    <radialGradient id="tachGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FF3E00" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#FF3E00" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#FF3E00" stop-opacity="0" />
    </radialGradient>

    <!-- Engineering Blueprint Grid -->
    <pattern id="cadGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="0.75" />
      <circle cx="0" cy="0" r="1" fill="rgba(255, 62, 0, 0.3)" />
    </pattern>

    <pattern id="cadGridSub" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255, 255, 255, 0.015)" stroke-width="0.5" />
    </pattern>
  </defs>

  <!-- Background layers -->
  <rect width="100%" height="100%" fill="url(#carbonBg)" />
  <rect width="100%" height="100%" fill="url(#cadGridSub)" />
  <rect width="100%" height="100%" fill="url(#cadGrid)" />
  <rect width="100%" height="100%" fill="url(#tachGlow)" />

  <!-- Frame border with technical notches -->
  <rect x="30" y="30" width="1220" height="660" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <path d="M 30 50 L 50 30" stroke="#FF3E00" stroke-width="2" />
  <path d="M 1250 50 L 1230 30" stroke="#FF3E00" stroke-width="2" />
  <path d="M 30 670 L 50 690" stroke="#FF3E00" stroke-width="2" />
  <path d="M 1250 670 L 1230 690" stroke="#FF3E00" stroke-width="2" />

  <!-- Top Telemetry Bar -->
  <g transform="translate(60, 65)">
    <text x="0" y="0" fill="#FF3E00" font-family="'JetBrains Mono', monospace, Consolas" font-size="11" font-weight="700" letter-spacing="2">[SPEC: VOLT-EV-INTERIOR]</text>
    <text x="240" y="0" fill="#71717A" font-family="'JetBrains Mono', monospace, Consolas" font-size="11" letter-spacing="1">CLIENT // VOLT MOTORS</text>
    <text x="960" y="0" fill="#71717A" font-family="'JetBrains Mono', monospace, Consolas" font-size="11" letter-spacing="1" text-anchor="end">COORD // 31.4201° S, 64.1888° W</text>
  </g>

  <!-- Central Technical 3D Wireframe Silhouette -->
  <g transform="translate(640, 320)">
    <!-- Aerodynamic Surface Lines -->
    <path d="M -420 80 C -280 -60, -140 -120, 0 -120 C 140 -120, 280 -60, 420 80" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <path d="M -380 95 C -240 -35, -120 -85, 0 -85 C 120 -85, 240 -35, 380 95" fill="none" stroke="#FF3E00" stroke-width="2" opacity="0.8" />
    <path d="M -480 120 L 480 120" stroke="rgba(255, 62, 0, 0.4)" stroke-width="1.5" stroke-dasharray="12 12" />

    <!-- Center Chassis Curve & Body Volume -->
    <path d="M -320 90 Q 0 -160 320 90 L 260 100 Q 0 -120 -260 100 Z" fill="rgba(255, 62, 0, 0.08)" stroke="#FF3E00" stroke-width="1.5" />

    <!-- Technical Optical / Hard-Surface Nodes -->
    <circle cx="-280" cy="95" r="5" fill="#FF3E00" />
    <circle cx="-280" cy="95" r="18" fill="none" stroke="#FF3E00" stroke-width="1" stroke-dasharray="3 3" />
    <text x="-280" y="130" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="middle">NODE_L_FRONT</text>

    <circle cx="280" cy="95" r="5" fill="#FF3E00" />
    <circle cx="280" cy="95" r="18" fill="none" stroke="#FF3E00" stroke-width="1" stroke-dasharray="3 3" />
    <text x="280" y="130" fill="#A1A1AA" font-family="monospace" font-size="9" text-anchor="middle">NODE_R_FRONT</text>

    <!-- Center Cockpit Core -->
    <ellipse cx="0" cy="-30" rx="140" ry="40" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />
    <ellipse cx="0" cy="-30" rx="90" ry="25" fill="none" stroke="#FF3E00" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Crosshair markers -->
    <path d="M -15 0 L 15 0 M 0 -15 L 0 15" stroke="#FFFFFF" stroke-width="1" opacity="0.7" />
  </g>

  <!-- Bottom Data Block -->
  <g transform="translate(60, 520)">
    <rect x="0" y="0" width="1160" height="120" fill="rgba(10, 10, 14, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Vertical Orange Accent Bar -->
    <rect x="0" y="0" width="4" height="120" fill="#FF3E00" />

    <text x="30" y="42" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">VOLT MOTORS: ELECTRIC VEHICLE OPTICS & DASHBOARD</text>
    <text x="30" y="75" fill="#A1A1AA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500">Integración de partes plásticas, dispositivos de montaje y faros para vehículos eléctricos</text>
    
    <!-- Specs row -->
    <text x="30" y="102" fill="#FF3E00" font-family="'JetBrains Mono', monospace, Consolas" font-size="10" font-weight="700" letter-spacing="1.5">// G2 CONTINUOUS SURFACING</text>
    <text x="240" y="102" fill="#71717A" font-family="'JetBrains Mono', monospace, Consolas" font-size="10" letter-spacing="1">// CATIA V5 &amp; BLENDER CYCLES</text>
    <text x="480" y="102" fill="#71717A" font-family="'JetBrains Mono', monospace, Consolas" font-size="10" letter-spacing="1">// 4K RENDER READY</text>
  </g>
</svg>