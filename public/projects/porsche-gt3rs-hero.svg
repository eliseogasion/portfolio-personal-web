<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="porscheBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0d" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#d5001c" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#d5001c" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#porscheBg)" />
  <rect width="100%" height="100%" fill="url(#heroGlow)" />

  <!-- Framing Outline -->
  <rect x="40" y="40" width="1200" height="640" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Top Metadata Header -->
  <g transform="translate(70, 75)">
    <circle cx="0" cy="-4" r="3" fill="#d5001c" />
    <text x="12" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">3D &amp; GAME ART // RENDER IN PROGRESS</text>
    <text x="1140" y="0" fill="#8c8c94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" letter-spacing="1" text-anchor="end">BLENDER CYCLES • 4K KEY ART</text>
  </g>

  <!-- Central Silhouette & Vehicle Form Lines -->
  <g transform="translate(640, 360)">
    <!-- Aerodynamic Roofline & Active Rear Wing -->
    <path d="M -480 60 C -320 -40, -180 -120, 40 -120 C 220 -120, 360 -40, 480 60" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <path d="M -440 70 C -300 -20, -160 -90, 40 -90 C 200 -90, 340 -20, 440 70" fill="none" stroke="#d5001c" stroke-width="2.5" opacity="0.8" />
    
    <!-- Swan-Neck Rear Wing Profile -->
    <path d="M 320 -70 L 440 -110 L 450 -105 L 340 -65 Z" fill="rgba(213, 0, 28, 0.3)" stroke="#d5001c" stroke-width="1.5" />

    <!-- Center Line Reflection Axis -->
    <line x1="-500" y1="90" x2="500" y2="90" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="6 6" />

    <!-- Title & Presentation Badge -->
    <text x="0" y="-10" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.5" text-anchor="middle">PORSCHE 911 GT3 RS (992)</text>
    <text x="0" y="20" fill="#8c8c94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" letter-spacing="1" text-anchor="middle">OFFICIAL LICENSE LAUNCH KEY ART // 16:9 MARKETING COMPOSITION</text>
  </g>

  <!-- Bottom Details -->
  <g transform="translate(70, 640)">
    <text x="0" y="0" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">DELIVERABLE: 16:9 4K HERO RENDER • TRI-COAT CLEARCOAT SHADING • EXPOSED CARBON LOUVERS</text>
  </g>
</svg>
