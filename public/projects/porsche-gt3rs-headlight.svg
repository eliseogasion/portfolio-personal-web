<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="porscheBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0b0d" />
      <stop offset="50%" stop-color="#141418" />
      <stop offset="100%" stop-color="#08080a" />
    </linearGradient>
    <radialGradient id="opticsGlow" cx="45%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#d5001c" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" fill="url(#porscheBg)" />
  <rect width="100%" height="100%" fill="url(#opticsGlow)" />
  <rect x="40" y="40" width="1200" height="640" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <g transform="translate(70, 75)">
    <circle cx="0" cy="-4" r="3" fill="#d5001c" />
    <text x="12" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5">MACRO STUDY 01 // MATRIX LED OPTICS</text>
    <text x="1140" y="0" fill="#8c8c94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="400" letter-spacing="1" text-anchor="end">INTERNAL REFRACTION &amp; DISPERSION</text>
  </g>

  <!-- Central Optical Schematic (4-Point DRL & Bi-LED Projector) -->
  <g transform="translate(640, 360)">
    <!-- Outer Lens Housing -->
    <ellipse cx="0" cy="0" rx="260" ry="170" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    <ellipse cx="-15" cy="-5" rx="240" ry="150" fill="rgba(255,255,255,0.02)" stroke="#d5001c" stroke-width="1" opacity="0.6" />

    <!-- 4-Point LED Signature -->
    <rect x="-140" y="-80" width="40" height="15" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="100" y="-80" width="40" height="15" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="-140" y="65" width="40" height="15" rx="3" fill="#ffffff" opacity="0.9" />
    <rect x="100" y="65" width="40" height="15" rx="3" fill="#ffffff" opacity="0.9" />

    <!-- Central Projector Glass Lens -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#d5001c" stroke-width="1.5" stroke-dasharray="4 4" />

    <text x="0" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.5" text-anchor="middle">4-POINT MATRIX LED OPTICAL STUDY</text>
    <text x="0" y="155" fill="#8c8c94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="400" letter-spacing="0.5" text-anchor="middle">POLYCARBONATE LENS WITH INTERNAL OPTICAL BAFFLES</text>
  </g>

  <g transform="translate(70, 640)">
    <text x="0" y="0" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">FOCUS: REAL AUTOMOTIVE OPTICAL DISPERSION &amp; INTERNAL LIGHT GUIDES</text>
  </g>
</svg>
